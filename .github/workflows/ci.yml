name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated TypeScript grammars when inputs or assets change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- grammars/ scripts/rebuild-typescript-grammars.sh .github/workflows/ci.yml; then
            ./scripts/rebuild-typescript-grammars.sh --check
          fi
      - run: npm install
      - run: npm run build
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test

  # Path separators and WASM loading only break on Windows, where people map
  # repos locally.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # LF checkouts, so fixtures parse as they do on Linux
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
